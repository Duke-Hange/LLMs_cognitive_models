experiment:
  split_type: train_test
  test_size: 0.2
  split_random_state_base: 1017
  seed: 42
  pool_seed: 42010
  prompt_version: en_v2
  k_values: [0, 1, 2, 5, 10]

data:
  prompts_jsonl: results/prompts_en_v2.jsonl
  output_dir: results
  cache_dir: results/cache

generation:
  output_key: P_B
  decimals: 4
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 1
  retry_instruction: "Output only one line in this exact format: P_B=0.6273"

ollama:
  base_url: http://127.0.0.1:11434
  model: qwen2.5:7b-instruct
  num_predict: 32

robustness:
  run_swap: true
  swap_tolerance: 0.05
